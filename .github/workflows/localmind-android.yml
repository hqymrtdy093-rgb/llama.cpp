name: PocketGGUF Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build PocketGGUF APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable PocketGGUF APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PocketGGUF-Android.apk
          test -s dist/PocketGGUF-Android.apk
      - name: Upload PocketGGUF APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGGUF-Android
          path: android-app/dist/PocketGGUF-Android.apk
          if-no-files-found: error
          retention-days: 14
