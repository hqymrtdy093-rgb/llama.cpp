name: PocketGGUF Android APK

on:
  push:
    branches:
      - "localmind/**"
    paths:
      - "android-app/**"
      - ".github/workflows/localmind-android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/localmind-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build PocketGGUF APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build debug-signed installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Give APK a user-friendly filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PocketGGUF-Android.apk
          test -s dist/PocketGGUF-Android.apk
      - name: Upload PocketGGUF APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGGUF-Android
          path: android-app/dist/PocketGGUF-Android.apk
          if-no-files-found: error
          retention-days: 14
