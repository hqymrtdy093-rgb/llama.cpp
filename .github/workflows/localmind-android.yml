name: LocalMind Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/localmind/**"
      - ".github/workflows/localmind-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android/localmind
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localmind-debug-apk
          path: android/localmind/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
