name: PocketGGUF Android APK

on:
  push:
    branches:
      - "localmind/**"
    paths:
      - "android-app/**"
      - ".github/workflows/localmind-android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/localmind-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketgguf-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build PocketGGUF APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Install pinned Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Validate Android project
        run: gradle --no-daemon --stacktrace tasks --all

      - name: Build installable PocketGGUF APK
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify and rename APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/PocketGGUF-Android.apk
          test -s dist/PocketGGUF-Android.apk
          ls -lh dist/PocketGGUF-Android.apk

      - name: Upload PocketGGUF APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketGGUF-Android
          path: android-app/dist/PocketGGUF-Android.apk
          if-no-files-found: error
          retention-days: 14
